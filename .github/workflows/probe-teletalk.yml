name: Probe Teletalk

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run probe
        run: node scripts/probe-teletalk.js
      - name: Commit result
        run: |
          git config user.name "circular-bot"
          git config user.email "bot@users.noreply.github.com"
          git add probe
          git diff --staged --quiet || (git commit -m "Probe: teletalk" && git push)
