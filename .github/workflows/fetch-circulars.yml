name: Fetch new circulars

on:
  schedule:
    - cron: '0 */3 * * *'   # প্রতি ৩ ঘণ্টায়
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run fetcher
        run: node scripts/fetch-circulars.js
      - name: Commit changes
        run: |
          git config user.name "circular-bot"
          git config user.email "bot@users.noreply.github.com"
          git add www/circulars.json scripts/seen.json
          git diff --staged --quiet || (git commit -m "Auto: update circulars" && git push)
