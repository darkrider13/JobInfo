name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'www/circulars.json'
      - 'www/pdfs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Set circulars URL for this repo
        run: |
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/www/circulars.json"
          sed -i "s|const REMOTE_URL = \"\";|const REMOTE_URL = \"${URL}\";|" www/index.html
          grep -n "const REMOTE_URL" www/index.html

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk sarkari-chakri.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sarkari-chakri-apk
          path: sarkari-chakri.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: সরকারি চাকরি v${{ github.run_number }}
          body: "নতুন APK বিল্ড (commit: ${{ github.sha }})"
          files: sarkari-chakri.apk
